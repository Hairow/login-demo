<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login Demo — OAuth 2.0</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
      color: #e0e0e0;
      padding: 20px;
    }

    .card {
      background: rgba(255, 255, 255, 0.06);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 48px 40px;
      width: 100%;
      max-width: 420px;
      text-align: center;
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.4);
    }

    h1 {
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .subtitle {
      font-size: 14px;
      color: #999;
      margin-bottom: 36px;
    }

    /* ---------- 未登录 ---------- */
    .login-buttons { display: flex; flex-direction: column; gap: 14px; }

    .btn-oauth {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      color: #fff;
      transition: transform 0.15s, box-shadow 0.15s;
    }
    .btn-oauth:hover  { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(0,0,0,0.3); }
    .btn-oauth:active { transform: translateY(0); }

    .btn-github { background: #24292e; }
    .btn-github:hover { background: #2f363d; }

    .btn-google {
      background: #fff;
      color: #333;
      border: 1px solid #ddd;
    }
    .btn-google:hover { background: #f5f5f5; }

    .btn-wechat { background: #07C160; }
    .btn-wechat:hover { background: #06AD56; }

    .btn-qq { background: #12B7F5; }
    .btn-qq:hover { background: #0EA5DA; }

    .btn-oauth svg { width: 22px; height: 22px; flex-shrink: 0; }

    /* ---------- 已登录 ---------- */
    .profile { display: none; flex-direction: column; align-items: center; gap: 16px; }

    .avatar {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      border: 3px solid rgba(255,255,255,0.2);
      object-fit: cover;
    }
    .avatar-placeholder {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: linear-gradient(135deg, #667eea, #764ba2);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      font-weight: 700;
      color: #fff;
    }

    .profile-name  { font-size: 20px; font-weight: 600; }
    .profile-email { font-size: 13px; color: #999; }
    .provider-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
    }
    .badge-github { background: #24292e; color: #fff; }
    .badge-google { background: #4285f4; color: #fff; }
    .badge-wechat { background: #07C160; color: #fff; }
    .badge-qq     { background: #12B7F5; color: #fff; }

    .btn-logout {
      margin-top: 8px;
      padding: 10px 36px;
      border: 1px solid rgba(255,255,255,0.25);
      border-radius: 10px;
      background: transparent;
      color: #e0e0e0;
      font-size: 14px;
      cursor: pointer;
      transition: background 0.15s;
    }
    .btn-logout:hover { background: rgba(255,255,255,0.08); }

    /* ---------- 加载状态 ---------- */
    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid rgba(255,255,255,0.15);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      margin: 20px auto;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Login Demo</h1>
    <p class="subtitle">通过 OAuth 2.0 安全登录</p>

    <!-- 加载中 -->
    <div id="loading" class="spinner hidden"></div>

    <!-- 未登录 -->
    <div id="login-view" class="login-buttons hidden">
      <a class="btn-oauth btn-github" href="/auth/github">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/></svg>
        GitHub 登录
      </a>
      <a class="btn-oauth btn-google" href="/auth/google">
        <svg viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 01-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
        Google 登录
      </a>
      <a class="btn-oauth btn-wechat" href="/auth/wechat">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M8.691 2.188C3.891 2.188 0 5.476 0 9.53c0 2.212 1.17 4.203 3.002 5.55a.59.59 0 01.213.665l-.39 1.48c-.019.07-.048.141-.048.213 0 .163.13.295.29.295a.326.326 0 00.167-.054l1.903-1.114a.864.864 0 01.717-.098 10.16 10.16 0 002.837.403c.276 0 .543-.027.811-.05-.857-2.578.157-4.972 1.932-6.446 1.703-1.415 3.882-1.98 5.853-1.838-.576-3.583-4.196-6.348-8.596-6.348zM5.785 5.991c.642 0 1.162.529 1.162 1.18a1.17 1.17 0 01-1.162 1.178A1.17 1.17 0 014.623 7.17c0-.651.52-1.18 1.162-1.18zm5.813 0c.642 0 1.162.529 1.162 1.18a1.17 1.17 0 01-1.162 1.178 1.17 1.17 0 01-1.162-1.178c0-.651.52-1.18 1.162-1.18zm5.34 2.867c-1.797-.052-3.746.512-5.28 1.786-1.72 1.428-2.687 3.72-1.78 6.22.942 2.453 3.666 4.229 6.884 4.229.826 0 1.622-.12 2.361-.336a.722.722 0 01.598.082l1.584.926a.272.272 0 00.14.045c.134 0 .24-.11.24-.245 0-.06-.024-.12-.04-.178l-.325-1.233a.49.49 0 01.178-.553C23.028 18.48 24 16.82 24 14.98c0-3.21-2.931-5.952-7.062-6.122zm-2.18 2.769c.535 0 .969.44.969.982a.976.976 0 01-.969.983.976.976 0 01-.969-.983c0-.542.434-.982.97-.982zm4.844 0c.535 0 .969.44.969.982a.976.976 0 01-.969.983.976.976 0 01-.969-.983c0-.542.434-.982.97-.982z"/></svg>
        微信登录
      </a>
      <a class="btn-oauth btn-qq" href="/auth/qq">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M21.395 15.035a40.62 40.62 0 00-.803-2.264l-1.079-2.695c.001-.032.014-.562.014-.836C19.526 4.632 17.351 0 12 0S4.474 4.632 4.474 9.241c0 .274.013.804.014.836l-1.08 2.695a38.8 38.8 0 00-.802 2.264c-1.021 3.283-1.045 4.643-1.045 4.643 0 .694.644 1.321 1.343 1.321.194 0 5.407-.534 9.096-.534 3.688 0 8.902.534 9.097.534a1.34 1.34 0 001.343-1.321c0-.001-.024-1.36-1.045-4.643zm-6.637-1.868c.283.098.493.363.493.669 0 .381-.309.69-.69.69h-.024a.69.69 0 01-.643-.437c-.541-1.357.142-2.604 2.042-2.604h.169c.178 0 .323.145.323.323v.277c0 .338-.161.656-.431.852a.699.699 0 01-.239.098v.132zm-7.819-.104a.795.795 0 01-.235-.1.99.99 0 01-.423-.853v-.277c0-.178.145-.323.323-.323h.169c1.9 0 2.582 1.247 2.042 2.604a.695.695 0 01-.616.437h-.024a.685.685 0 01-.668-.69c0-.295.196-.552.471-.655.022-.461.128-1.251.476-1.74-1.3-.24-2.16.045-1.515 1.597z"/></svg>
        QQ 登录
      </a>
    </div>

    <!-- 已登录 -->
    <div id="profile-view" class="profile hidden">
      <img id="avatar-img" class="avatar hidden" alt="avatar" />
      <div id="avatar-ph" class="avatar-placeholder hidden"></div>
      <div class="profile-name"  id="profile-name"></div>
      <div class="profile-email" id="profile-email"></div>
      <span class="provider-badge" id="provider-badge"></span>
      <a class="btn-logout" href="/auth/logout">退出登录</a>
    </div>
  </div>

  <script>
    async function init() {
      const loading  = document.getElementById("loading");
      const loginView  = document.getElementById("login-view");
      const profileView = document.getElementById("profile-view");

      loading.classList.remove("hidden");

      try {
        const resp = await fetch("/auth/user");
        if (resp.ok) {
          const user = await resp.json();
          showProfile(user);
        } else {
          showLogin();
        }
      } catch {
        showLogin();
      } finally {
        loading.classList.add("hidden");
      }
    }

    function showLogin() {
      document.getElementById("login-view").classList.remove("hidden");
      document.getElementById("profile-view").classList.add("hidden");
    }

    function showProfile(user) {
      document.getElementById("login-view").classList.add("hidden");
      document.getElementById("profile-view").classList.remove("hidden");

      document.getElementById("profile-name").textContent  = user.name;
      document.getElementById("profile-email").textContent = user.email || "";

      // 头像
      const avatarImg = document.getElementById("avatar-img");
      const avatarPh  = document.getElementById("avatar-ph");
      if (user.avatar) {
        avatarImg.src = user.avatar;
        avatarImg.classList.remove("hidden");
        avatarPh.classList.add("hidden");
      } else {
        avatarImg.classList.add("hidden");
        avatarPh.textContent = (user.name || "U")[0].toUpperCase();
        avatarPh.classList.remove("hidden");
      }

      // 提供商徽章
      const badge = document.getElementById("provider-badge");
      if (user.provider === "github") {
        badge.textContent = "GitHub";
        badge.className = "provider-badge badge-github";
      } else if (user.provider === "google") {
        badge.textContent = "Google";
        badge.className = "provider-badge badge-google";
      } else if (user.provider === "wechat") {
        badge.textContent = "微信";
        badge.className = "provider-badge badge-wechat";
      } else if (user.provider === "qq") {
        badge.textContent = "QQ";
        badge.className = "provider-badge badge-qq";
      }
    }

    init();
  </script>
</body>
</html>
